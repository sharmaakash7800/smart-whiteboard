<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeachBoard Pro</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }
    
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #0f172a;
    }

    #board-wrapper { 
      width: 100vw; height: 100vh; overflow: auto; display: flex; 
      flex-direction: column; align-items: center; padding: 24px 0 100px 0;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
    }

    #render-container {
      display: flex; flex-direction: column; gap: 20px; align-items: center;
    }

    .page-box {
      position: relative; 
      background: #ffffff; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
      border-radius: 8px; 
      overflow: hidden;
    }

    canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .pdf-layer { z-index: 1; pointer-events: none; }
    .draw-layer { z-index: 2; pointer-events: auto; touch-action: none; }

    /* Left Toolbar */
    #sidebar {
      position: fixed; top: 16px; left: 16px; z-index: 9999;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
      border-radius: 16px; padding: 8px 6px; display: flex;
      flex-direction: column; gap: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-height: 85vh; overflow-y: auto;
    }
    #sidebar::-webkit-scrollbar { display: none; }

    .t-btn {
      width: 36px; height: 36px; border: none; border-radius: 10px;
      background: transparent; color: #475569; font-size: 15px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: 0.15s;
    }
    .t-btn:hover { background: #e0e7ff; color: #2563eb; }
    .t-btn.active { background: #2563eb !important; color: #ffffff !important; }

    .sep { width: 22px; height: 1px; background: #e2e8f0; margin: 2px auto; }

    input[type="color"] {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff;
      cursor: pointer; background: none; margin: 0 auto;
    }
    input[type="file"] { display: none; }

    /* Bottom Status Dock */
    #bottom-dock {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
      border-radius: 14px; padding: 6px 14px; display: flex; gap: 8px;
      align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,0.3); z-index: 9999;
    }

    #install-btn {
      display: none; background: #10b981; color: white; border: none;
      padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="board-wrapper">
    <div id="render-container"></div>
  </div>

  <div id="sidebar">
    <button class="t-btn active" id="btn-pen" title="Pen"><i class="fa-solid fa-pen-nib"></i></button>
    <button class="t-btn" id="btn-brush" title="Paint Brush" style="color: #ec4899;"><i class="fa-solid fa-paintbrush"></i></button>
    <button class="t-btn" id="btn-highlighter" title="Highlighter"><i class="fa-solid fa-highlighter"></i></button>
    <button class="t-btn" id="btn-eraser" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
    <button class="t-btn" id="btn-stamp" title="Stamp" style="color: #10b981;"><i class="fa-solid fa-stamp"></i></button>

    <div class="sep"></div>

    <input type="color" id="pen-color" value="#2563eb">
    <button class="t-btn" id="btn-add-page" title="New Page" style="color: #10b981;"><i class="fa-solid fa-file-circle-plus"></i></button>
    <label class="t-btn" for="pdf-input" title="Open PDF"><i class="fa-solid fa-file-pdf"></i></label>
    <input type="file" id="pdf-input" accept="application/pdf">

    <div class="sep"></div>

    <button class="t-btn" id="btn-undo" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
    <button class="t-btn" id="btn-export" title="Save Image"><i class="fa-solid fa-download"></i></button>
    <button class="t-btn" id="btn-clear" title="Clear Canvas" style="color: #ef4444;"><i class="fa-solid fa-trash-can"></i></button>
  </div>

  <div id="bottom-dock">
    <button id="install-btn"><i class="fa-solid fa-download"></i> Install App</button>
    <button class="t-btn" id="zoom-out"><i class="fa-solid fa-minus"></i></button>
    <span id="zoom-text" style="font-size: 12px; font-weight: bold; color: #334155;">100%</span>
    <button class="t-btn" id="zoom-in"><i class="fa-solid fa-plus"></i></button>
  </div>

  <script>
    // Safe PDF Worker initialization
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let currentTool = 'pen';
    let currentScale = 1.0;
    let isDrawing = false;
    let startX = 0, startY = 0;
    let lastX = 0, lastY = 0;
    let pdfDoc = null;
    let activeCanvas = null;

    const renderContainer = document.getElementById('render-container');
    const historyMap = new WeakMap();

    // Tool Switch
    function setTool(tool, el) {
      document.querySelectorAll('#sidebar .t-btn').forEach(b => b.classList.remove('active'));
      currentTool = tool;
      if (el) el.classList.add('active');
    }

    document.getElementById('btn-pen').addEventListener('click', (e) => setTool('pen', e.currentTarget));
    document.getElementById('btn-brush').addEventListener('click', (e) => setTool('brush', e.currentTarget));
    document.getElementById('btn-highlighter').addEventListener('click', (e) => setTool('highlighter', e.currentTarget));
    document.getElementById('btn-eraser').addEventListener('click', (e) => setTool('eraser', e.currentTarget));
    document.getElementById('btn-stamp').addEventListener('click', (e) => setTool('stamp', e.currentTarget));

    // Force Page Creation
    function createBlankWhiteboard() {
      const dpr = window.devicePixelRatio || 1;
      const width = Math.min(Math.max(window.innerWidth * 0.9, 800), 1000) * currentScale;
      const height = (window.innerHeight * 0.85) * currentScale;

      const pageBox = document.createElement('div');
      pageBox.className = 'page-box';
      pageBox.style.width = width + 'px';
      pageBox.style.height = height + 'px';

      const dCanvas = document.createElement('canvas');
      dCanvas.className = 'draw-layer';
      dCanvas.width = width * dpr;
      dCanvas.height = height * dpr;
      
      const ctx = dCanvas.getContext('2d');
      ctx.scale(dpr, dpr);

      historyMap.set(dCanvas, []);

      pageBox.appendChild(dCanvas);
      renderContainer.appendChild(pageBox);

      activeCanvas = dCanvas;
      attachDraw(dCanvas);
    }

    function renderAll() {
      renderContainer.innerHTML = '';
      document.getElementById('zoom-text').innerText = Math.round(currentScale * 100) + '%';

      if (!pdfDoc) {
        createBlankWhiteboard();
        return;
      }

      const dpr = window.devicePixelRatio || 1;

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        pdfDoc.getPage(i).then(page => {
          const viewport = page.getViewport({ scale: currentScale });

          const pageBox = document.createElement('div');
          pageBox.className = 'page-box';
          pageBox.style.width = viewport.width + 'px';
          pageBox.style.height = viewport.height + 'px';

          const pCanvas = document.createElement('canvas');
          pCanvas.className = 'pdf-layer';
          pCanvas.width = viewport.width * dpr;
          pCanvas.height = viewport.height * dpr;
          const pCtx = pCanvas.getContext('2d');
          pCtx.scale(dpr, dpr);

          const dCanvas = document.createElement('canvas');
          dCanvas.className = 'draw-layer';
          dCanvas.width = viewport.width * dpr;
          dCanvas.height = viewport.height * dpr;
          const dCtx = dCanvas.getContext('2d');
          dCtx.scale(dpr, dpr);

          historyMap.set(dCanvas, []);

          pageBox.appendChild(pCanvas);
          pageBox.appendChild(dCanvas);
          renderContainer.appendChild(pageBox);

          page.render({ canvasContext: pCtx, viewport: viewport });
          attachDraw(dCanvas);
        });
      }
    }

    // PDF Load Fix
    document.getElementById('pdf-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type === "application/pdf") {
        const reader = new FileReader();
        reader.onload = function() {
          const typedarray = new Uint8Array(this.result);
          pdfjsLib.getDocument(typedarray).promise.then(doc => {
            pdfDoc = doc;
            renderAll();
          });
        };
        reader.readAsArrayBuffer(file);
      }
    });

    document.getElementById('btn-add-page').addEventListener('click', createBlankWhiteboard);

    // Drawing Engine
    function attachDraw(canvas) {
      const ctx = canvas.getContext('2d');

      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) / currentScale,
          y: (clientY - rect.top) / currentScale
        };
      }

      function start(e) {
        if (e.cancelable) e.preventDefault();
        isDrawing = true;
        activeCanvas = canvas;
        const pos = getCoords(e);
        startX = pos.x; startY = pos.y;
        lastX = pos.x; lastY = pos.y;

        if (currentTool === 'stamp') {
          ctx.font = '32px sans-serif';
          ctx.fillText('⭐', pos.x - 16, pos.y + 16);
          saveHistory(canvas);
          isDrawing = false;
          return;
        }

        ctx.beginPath();
        ctx.moveTo(startX, startY);
      }

      function draw(e) {
        if (!isDrawing || activeCanvas !== canvas) return;
        if (e.cancelable) e.preventDefault();
        const pos = getCoords(e);
        const color = document.getElementById('pen-color').value;

        if (currentTool === 'pen') {
          ctx.globalAlpha = 1.0;
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        } else if (currentTool === 'highlighter') {
          ctx.globalAlpha = 0.3;
          ctx.strokeStyle = color;
          ctx.lineWidth = 16;
          ctx.lineCap = 'square';
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
          ctx.globalAlpha = 1.0;
        } else if (currentTool === 'brush') {
          ctx.globalAlpha = 0.2;
          ctx.strokeStyle = color;
          ctx.lineWidth = 10;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
          lastX = pos.x; lastY = pos.y;
          ctx.globalAlpha = 1.0;
        } else if (currentTool === 'eraser') {
          ctx.clearRect(pos.x - 12, pos.y - 12, 24, 24);
        }
      }

      function stop() {
        if (isDrawing) {
          isDrawing = false;
          saveHistory(canvas);
        }
      }

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stop);

      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stop);
    }

    // Save & Undo
    function saveHistory(canvas) {
      const history = historyMap.get(canvas) || [];
      const ctx = canvas.getContext('2d');
      history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      if (history.length > 15) history.shift();
      historyMap.set(canvas, history);
    }

    document.getElementById('btn-undo').addEventListener('click', () => {
      if (!activeCanvas) return;
      const history = historyMap.get(activeCanvas);
      if (history && history.length > 1) {
        history.pop();
        const prev = history[history.length - 1];
        activeCanvas.getContext('2d').putImageData(prev, 0, 0);
      } else {
        activeCanvas.getContext('2d').clearRect(0, 0, activeCanvas.width, activeCanvas.height);
      }
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      document.querySelectorAll('.draw-layer').forEach(c => {
        c.getContext('2d').clearRect(0, 0, c.width, c.height);
        historyMap.set(c, []);
      });
    });

    document.getElementById('zoom-in').addEventListener('click', () => { currentScale += 0.15; renderAll(); });
    document.getElementById('zoom-out').addEventListener('click', () => { if (currentScale > 0.4) { currentScale -= 0.15; renderAll(); } });

    document.getElementById('btn-export').addEventListener('click', () => {
      const c = document.querySelector('.draw-layer');
      if (!c) return;
      const a = document.createElement('a');
      a.download = 'whiteboard.png';
      a.href = c.toDataURL();
      a.click();
    });

    // PWA Install Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const b = document.getElementById('install-btn');
      b.style.display = 'block';
      b.onclick = () => {
        deferredPrompt.prompt();
        b.style.display = 'none';
      };
    });

    // Initial Start
    renderAll();
  </script>
</body>
</html>
