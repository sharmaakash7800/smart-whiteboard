<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeachBoard Smart Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #e2e8f0; color: #333; height: 100vh; width: 100vw; overflow: hidden; display: flex; }
    
    /* Continuous Scrollable Board Wrapper */
    #board-wrapper { 
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
      overflow: auto; background-color: #cbd5e1; display: flex; flex-direction: column;
      align-items: center; padding: 20px 0; -webkit-overflow-scrolling: touch;
    }

    #pdf-render-container {
      display: flex; flex-direction: column; gap: 16px; align-items: center; width: 100%;
    }

    .page-wrapper {
      position: relative; box-shadow: 0 8px 25px rgba(0,0,0,0.15); background: #ffffff;
    }

    canvas { display: block; position: absolute; top: 0; left: 0; }
    .pdf-canvas-layer { z-index: 1; }
    .draw-canvas-layer { z-index: 2; touch-action: none; }

    /* Floating Eye Toggle Button */
    #eye-toggle-btn {
      position: fixed; top: 20px; left: 16px; z-index: 101;
      width: 44px; height: 44px; border-radius: 50%; background: #ffffff;
      color: #2563eb; border: 1px solid #cbd5e1; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;
    }

    /* Slim White Vertical Toolbar */
    .left-bar {
      position: fixed; top: 74px; left: 16px; z-index: 100;
      width: 46px; background: #ffffff; border-radius: 23px; display: flex; flex-direction: column;
      align-items: center; padding: 10px 0; gap: 8px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      border: 1px solid #e2e8f0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Manual Hide State */
    .hidden-ui {
      display: none !important;
    }

    .tool-btn {
      background: transparent; color: #64748b; border: none; width: 34px; height: 34px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 15px; cursor: pointer; transition: all 0.2s ease;
    }
    .tool-btn:active { transform: scale(0.9); }
    .tool-btn.active { background: #2563eb; color: #ffffff; font-weight: bold; }

    .flyout-panel {
      position: fixed; top: 74px; left: 70px; z-index: 99; width: 200px;
      background: #ffffff; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12); border: 1px solid #e2e8f0;
      transform: translateX(-120%); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .flyout-panel.open { transform: translateX(0); }

    .flyout-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px;
      color: #334155; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.2s;
    }
    .flyout-item:hover { background: #f1f5f9; }

    .bottom-right-dock {
      position: fixed; bottom: 16px; right: 16px; z-index: 100; background: #ffffff;
      border-radius: 20px; padding: 4px 10px; display: flex; gap: 6px; align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e2e8f0;
    }

    input[type="color"] { border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; background: none; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <!-- Full Height Scrollable Container -->
  <div id="board-wrapper">
    <div id="pdf-render-container"></div>
  </div>

  <!-- Hide/Show Toggle Eye Button -->
  <button id="eye-toggle-btn" title="Toggle Toolbar"><i class="fa-solid fa-eye"></i></button>

  <!-- Left Sidebar Controls -->
  <div class="left-bar" id="left-toolbar">
    <button class="tool-btn" id="btn-pen" title="Pen Mode"><i class="fa-solid fa-pen-nib"></i></button>
    <button class="tool-btn" id="btn-eraser" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
    <button class="tool-btn" id="btn-undo" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
    <button class="tool-btn" id="btn-redo" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
    <button class="tool-btn" id="btn-tools-menu" title="Tools Menu"><i class="fa-solid fa-shapes"></i></button>
    <label class="tool-btn" for="file-input" title="Open PDF"><i class="fa-solid fa-file-pdf"></i></label>
    <input type="file" id="file-input" accept="application/pdf">
    <button class="tool-btn" id="btn-clear" title="Clear All" style="color: #ef4444;"><i class="fa-solid fa-trash"></i></button>
    <input type="color" id="pen-color" value="#2563eb">
  </div>

  <!-- Shapes Submenu -->
  <div class="flyout-panel" id="flyout-menu">
    <div class="flyout-item" data-action="pointer"><i class="fa-solid fa-arrow-pointer"></i> Laser Pointer</div>
    <div class="flyout-item" data-action="line"><i class="fa-solid fa-minus"></i> Line</div>
    <div class="flyout-item" data-action="arrow"><i class="fa-solid fa-arrow-right"></i> Arrow</div>
    <div class="flyout-item" data-action="rect"><i class="fa-regular fa-square"></i> Rectangle</div>
    <div class="flyout-item" data-action="circle"><i class="fa-regular fa-circle"></i> Circle</div>
  </div>

  <!-- Zoom Dock -->
  <div class="bottom-right-dock" id="bottom-dock">
    <button class="tool-btn" id="zoom-out"><i class="fa-solid fa-minus"></i></button>
    <span id="zoom-text" style="font-size: 12px; font-weight: 600; color: #475569;">100%</span>
    <button class="tool-btn" id="zoom-in"><i class="fa-solid fa-plus"></i></button>
  </div>

  <script src="app.js"></script>
</body>
</html>
